spring:
  application:
    name: recruitment
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/recruitment}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  flyway:
    locations: classpath:db/migration
    baseline-on-migrate: false
  jpa:
    hibernate:
      ddl-auto: none

jwt:
  secret: ${JWT_SECRET:change-this-in-production-must-be-at-least-32-chars}
  expiry-hours: ${JWT_EXPIRY_HOURS:1}

app:
  base-url: ${APP_BASE_URL:http://localhost:4200}
  judge0:
    base-url: ${JUDGE0_BASE_URL:http://localhost:2358}
    api-key: ${JUDGE0_API_KEY:}
    # Per-language Judge0 CE IDs — override for Judge0 Extra CE / RapidAPI (JAVA=91, CSHARP=29)
    language-ids:
      java: ${JUDGE0_LANG_JAVA:62}
      csharp: ${JUDGE0_LANG_CSHARP:51}
      python: ${JUDGE0_LANG_PYTHON:71}
