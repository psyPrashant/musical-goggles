name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend — Build & Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: recruitment-be

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: recruitment
          POSTGRES_USER: recruitment
          POSTGRES_PASSWORD: recruitment
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 17 (Temurin)
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin

      - name: Cache Maven dependencies
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('recruitment-be/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Make mvnw executable
        run: chmod +x mvnw

      - name: Build
        run: ./mvnw clean package -DskipTests -q

      - name: Test
        run: ./mvnw test
        env:
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/recruitment
          SPRING_DATASOURCE_USERNAME: recruitment
          SPRING_DATASOURCE_PASSWORD: recruitment
          SPRING_JPA_HIBERNATE_DDL_AUTO: validate
          SPRING_JPA_SHOW_SQL: "false"

  frontend:
    name: Frontend — Type-check & Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: recruitment-fe

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Cache node_modules
        uses: actions/cache@v4
        with:
          path: recruitment-fe/node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('recruitment-fe/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npx tsc --noEmit

      - name: Test
        run: npm test
