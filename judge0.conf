# Judge0 CE configuration
# -----------------------------------------------------------------
# Database (separate Postgres instance just for Judge0)
POSTGRES_HOST=judge0-db
POSTGRES_PORT=5432
POSTGRES_DB=judge0
POSTGRES_USER=judge0
POSTGRES_PASSWORD=judge0

# Redis
REDIS_HOST=judge0-redis
REDIS_PORT=6379

# Enable synchronous ?wait=true submissions (required by this app)
ALLOW_ENABLE_WAIT_RESULT=true
ENABLE_WAIT_RESULT=true

# Execution limits
CPU_TIME_LIMIT=10
EXTRA_CPU_TIME=1
WALL_TIME_LIMIT=15
MEMORY_LIMIT=131072
STACK_LIMIT=65536
MAX_PROCESSES_AND_OR_THREADS=60
ENABLE_PER_PROCESS_AND_THREAD_TIME_LIMIT=false
ENABLE_PER_PROCESS_AND_THREAD_MEMORY_LIMIT=false
MAX_FILE_SIZE=1024

MAINTENANCE_MODE=false
SECRET_KEY=dev-secret-key
