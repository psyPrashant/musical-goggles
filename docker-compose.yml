services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${DB_NAME:-recruitment}
      POSTGRES_USER: ${DB_USER:-recruitment}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-recruitment}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-recruitment}"]
      interval: 10s
      timeout: 5s
      retries: 5

  mailhog:
    image: mailhog/mailhog
    ports:
      - "1025:1025"
      - "8025:8025"

  # ── Judge0 CE — code execution sandbox ─────────────────────────────────────
  judge0-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: judge0
      POSTGRES_USER: judge0
      POSTGRES_PASSWORD: judge0
    volumes:
      - judge0_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U judge0"]
      interval: 5s
      timeout: 3s
      retries: 10

  judge0-redis:
    image: redis:7.2-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  judge0-server:
    image: judge0/judge0:1.13.1
    volumes:
      - ./judge0.conf:/judge0.conf:ro
    ports:
      - "2358:2358"
    privileged: true
    restart: always
    depends_on:
      judge0-db:
        condition: service_healthy
      judge0-redis:
        condition: service_healthy

  judge0-workers:
    image: judge0/judge0:1.13.1
    command: ["./scripts/workers"]
    volumes:
      - ./judge0.conf:/judge0.conf:ro
    privileged: true
    restart: always
    depends_on:
      judge0-db:
        condition: service_healthy
      judge0-redis:
        condition: service_healthy
  # ── end Judge0 ───────────────────────────────────────────────────────────────

  backend:
    build: ./recruitment-be
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-dev}
      SERVER_PORT: 8080
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/${DB_NAME:-recruitment}
      SPRING_DATASOURCE_USERNAME: ${DB_USER:-recruitment}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:-recruitment}
      SPRING_MAIL_HOST: mailhog
      SPRING_MAIL_PORT: 1025
      JUDGE0_BASE_URL: http://judge0-server:2358
    depends_on:
      db:
        condition: service_healthy
      mailhog:
        condition: service_started
      judge0-server:
        condition: service_started

  frontend:
    build: ./recruitment-fe
    ports:
      - "127.0.0.1:4200:80"
    depends_on:
      - backend

volumes:
  postgres_data:
  judge0_postgres_data:
