services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${DB_NAME:-recruitment}
      POSTGRES_USER: ${DB_USER:-recruitment}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-recruitment}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-recruitment}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: ./recruitment-be
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-dev}
      SERVER_PORT: 8080
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/${DB_NAME:-recruitment}
      SPRING_DATASOURCE_USERNAME: ${DB_USER:-recruitment}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:-recruitment}
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./recruitment-fe
    ports:
      - "127.0.0.1:4200:80"
    depends_on:
      - backend

volumes:
  postgres_data:
